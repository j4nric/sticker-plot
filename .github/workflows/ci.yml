name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest ist seit 11.11.2026 Ubuntu 26.04; dort lädt apt die
    # Playwright-Abhängigkeiten nicht. Bis das geht, fest auf 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium für die PDF-Tests
        run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Eintrag für den vorderen Caddy prüfen (deploy/tee.caddy)
        run: |
          sed 's/__DOMAIN__/tee.example.org/g' deploy/tee.caddy > "$RUNNER_TEMP/tee.caddy"
          docker run --rm -v "$RUNNER_TEMP/tee.caddy:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
